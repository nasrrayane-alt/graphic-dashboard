<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد واحد گرافیک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1e24;--mut:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--card:#1c1e24;--tx:#eceef2;--mut:#9aa1ad;--bd:#2c2f38;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#121317;--card:#1c1e24;--tx:#eceef2;--mut:#9aa1ad;--bd:#2c2f38;--ac:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:800}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.k b{display:block;font-size:26px;font-weight:800;margin-top:4px}
.k span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px}
.row{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;cursor:pointer}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--bd)}
.late{color:var(--bad);font-weight:600}
.hint{color:var(--mut);font-size:12px;margin:8px 0 16px}
td select{max-width:130px;padding:4px 6px}.num{width:64px;padding:4px 6px}
.dt{border:0;background:transparent;cursor:pointer;padding:0 4px;font-size:14px}
#cal{position:fixed;z-index:50;width:272px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg i{font-style:normal;color:var(--mut);font-size:11px;padding:4px 0}
#cal button{background:transparent;color:var(--tx);border:0;border-radius:8px;padding:6px 0;font:inherit;cursor:pointer}
#cal button:hover{background:var(--bd)}
#cal .sel{background:var(--ac);color:#fff}#cal .td{outline:1px solid var(--ac)}
.cf{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid var(--bd);padding-top:6px}.cf button{padding:4px 8px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📊 داشبورد واحد گرافیک</h1>
  <div>
    <button class="btn" onclick="document.getElementById('f').click()">ورود فایل CSV از نوشن</button>
    <button class="btn o" onclick="loadSample()">داده نمونه</button>
    <input type="file" id="f" accept=".csv" hidden>
  </div>
</header>
<p class="hint" id="src"></p>
<section class="kpis" id="kpis"></section>
<section class="grid">
  <div class="card"><h3>وضعیت درخواست‌ها</h3><div id="c1"></div></div>
  <div class="card"><h3>درخواست بر اساس دپارتمان</h3><div id="c2"></div></div>
  <div class="card"><h3>اولویت</h3><div id="c3"></div></div>
  <div class="card"><h3>نوع درخواست</h3><div id="c4"></div></div>
</section>
<div class="card">
  <div class="tools">
    <input id="q" placeholder="جستجو (نام پروژه، درخواست‌دهنده...)">
    <select id="fs"><option value="">همه وضعیت‌ها</option></select>
    <select id="fp"><option value="">همه اولویت‌ها</option></select>
    <select id="fo"><option value="">همه</option><option value="late">فقط دارای تأخیر</option><option value="open">فقط باز</option></select>
  </div>
  <div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</div>
<div id="cal" hidden></div>
<script>
const COLS=[['Project Code','کد'],['Project Name','پروژه'],['Requester','درخواست‌دهنده'],['Department','دپارتمان'],['Request Type','نوع'],['Priority','اولویت'],['Status','وضعیت'],['Start Date','شروع'],['Committed Deadline','ددلاین تعهدی'],['Final Delivery Date','تحویل نهایی'],['Approval Status','تأیید'],['Revision Count','بازبینی'],['Estimated Hours','ساعت']];
const SAMPLE=`Project Name,Project Code,Requester,Department,Request Type,Priority,Estimated Hours,Status,Start Date,Committed Deadline,Approval Status,Revision Count,Final Delivery Date,Archive
بنر کمپین پاییز,GR-101,سارا احمدی,بازاریابی,بنر,High,6,In Progress,"October 8, 2026","October 12, 2026",Pending,1,,No
کاتالوگ محصولات,GR-102,علی رضایی,فروش,کاتالوگ,Medium,20,In Review,"October 1, 2026","October 15, 2026",Pending,2,,No
پست اینستاگرام,GR-103,مریم کاظمی,بازاریابی,شبکه اجتماعی,Low,2,Done,"October 5, 2026","October 7, 2026",Approved,0,"October 7, 2026",No
تابلوی ورودی,GR-104,رضا نوری,مدیریت,محیطی,High,12,Not Started,,"October 20, 2026",Pending,0,,No
بروشور رویداد,GR-105,سارا احمدی,بازاریابی,چاپی,Medium,10,Done,"September 25, 2026","October 3, 2026",Approved,3,"October 6, 2026",No
اینفوگرافیک گزارش,GR-106,نگار صادقی,مالی,اینفوگرافیک,Medium,8,In Progress,"October 9, 2026","October 14, 2026",Pending,1,,No
لوگوی زیربرند,GR-107,علی رضایی,فروش,هویت بصری,High,30,In Review,"September 28, 2026","October 10, 2026",Pending,4,,No`;
let rows=[],sortK=null,sortD=1;const SCH={};
const EDITABLE=['Status','Priority','Approval Status','Request Type','Department','Start Date','Committed Deadline','Final Delivery Date','Revision Count','Estimated Hours'];
function cell(r,k,ed,v){const t=ed.type,id=r._id;
 if(t=='select'||t=='status'){const o=[...new Set(['',...ed.options,r[k]||''])];return `<select onchange="save('${id}','${k}',this.value)">${o.map(x=>`<option${x==(r[k]||'')?' selected':''}>${esc(x)}</option>`).join('')}</select>`}
 if(t=='date')return `<span class="${k=='Committed Deadline'&&isLate(r)?'late':''}">${k=='Committed Deadline'&&isLate(r)?'⚠ ':''}${J(r[k])}</span><button class="dt" title="انتخاب تاریخ شمسی" onclick="openCal(event,'${id}','${k}')">📅</button>`;
 if(t=='number')return `<input type="number" class="num" value="${esc(r[k]||'')}" onchange="save('${id}','${k}',this.value)">`;
 return v}
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
 let gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,leapG,march,n,i;
 for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1;return{gy:div(j,1461)-100100+div(8-gm,6),gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
 if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}k-=186}else{jy--;k+=179;if(r.leap===1)k++}
 return{jy,jm:7+div(k,30),jd:mod(k,30)+1}}
const toJalaali=(y,m,d)=>d2j(g2d(y,m,d)),toGregorian=(y,m,d)=>d2g(j2d(y,m,d));
const jalaaliMonthLength=(y,m)=>m<=6?31:m<=11?30:jalCal(y).leap===0?30:29;

const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fan=n=>n.toLocaleString('fa-IR',{useGrouping:false}),p2=n=>String(n).padStart(2,'0');
let cT=null,cy=0,cm=0,cs=null;
function openCal(e,id,prop){e.stopPropagation();const r=rows.find(x=>x._id==id),m=/^(\d{4})-(\d\d)-(\d\d)/.exec(r[prop]||''),t=new Date();
 const g=m?{gy:+m[1],gm:+m[2],gd:+m[3]}:{gy:t.getFullYear(),gm:t.getMonth()+1,gd:t.getDate()};
 const j=toJalaali(g.gy,g.gm,g.gd);cs=m?j:null;cy=j.jy;cm=j.jm;cT={id,prop};
 const c=$('cal');c.hidden=false;drawCal();
 const b=e.currentTarget.getBoundingClientRect(),w=c.offsetWidth,h=c.offsetHeight;
 c.style.left=Math.max(8,Math.min(innerWidth-w-8,b.left+b.width/2-w/2))+'px';
 c.style.top=Math.max(8,Math.min(innerHeight-h-8,b.bottom+6))+'px'}
function closeCal(){$('cal').hidden=true}
function navCal(d){cm+=d;if(cm>12){cm=1;cy++}if(cm<1){cm=12;cy--}drawCal()}
function drawCal(){const len=jalaaliMonthLength(cy,cm),g=toGregorian(cy,cm,1),off=(new Date(Date.UTC(g.gy,g.gm-1,g.gd)).getUTCDay()+1)%7,t=new Date(),tj=toJalaali(t.getFullYear(),t.getMonth()+1,t.getDate());
 let h=`<div class="ch"><button onclick="navCal(-1)">▶</button><b>${JM[cm-1]} ${fan(cy)}</b><button onclick="navCal(1)">◀</button></div><div class="cg">`+'ش ی د س چ پ ج'.split(' ').map(x=>`<i>${x}</i>`).join('');
 for(let i=0;i<off;i++)h+='<span></span>';
 for(let d=1;d<=len;d++){const sel=cs&&cs.jy==cy&&cs.jm==cm&&cs.jd==d,td=tj.jy==cy&&tj.jm==cm&&tj.jd==d;h+=`<button class="${sel?'sel':td?'td':''}" onclick="pickCal(${d})">${fan(d)}</button>`}
 $('cal').innerHTML=h+`</div><div class="cf"><button onclick="pickToday()">امروز</button><button onclick="pickCal(0)">پاک کردن</button><button onclick="closeCal()">بستن</button></div>`}
function pickCal(d){if(!cT)return;const{id,prop}=cT;let iso='';if(d){const g=toGregorian(cy,cm,d);iso=`${g.gy}-${p2(g.gm)}-${p2(g.gd)}`}closeCal();save(id,prop,iso)}
function pickToday(){if(!cT)return;const t=new Date(),{id,prop}=cT;closeCal();save(id,prop,`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`)}
document.addEventListener('click',e=>{if(!$('cal').contains(e.target)&&!e.target.classList.contains('dt'))closeCal()});
async function save(id,prop,val){const r=rows.find(x=>x._id==id),old=r[prop];
 r[prop]=prop=='Archive'?'Yes':String(val);render();
 try{const res=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,prop,value:val})});if(!res.ok)throw new Error(await res.text())}
 catch(e){r[prop]=old;render();alert('ذخیره در نوشن ناموفق بود:\n'+e.message)}}
const $=id=>document.getElementById(id);
const TODAY=new Date();TODAY.setHours(0,0,0,0);
function parseCSV(t){const r=[];let row=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x))r.push(row);row=[]}
  else c+=ch}
 if(c||row.length){row.push(c);r.push(row)}
 const h=r.shift().map(x=>x.trim());
 return r.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').trim()])))}
const D=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?null:d};
const DATEK=['Start Date','Committed Deadline','Final Delivery Date','Requested Deadline','Request Date'];
function J(s){const d=D(s);if(!d)return s||'';const o={year:'numeric',month:'2-digit',day:'2-digit'};if(/^\d{4}-\d{2}-\d{2}$/.test(s))o.timeZone='UTC';return d.toLocaleDateString('fa-IR-u-ca-persian',o)}
const isDone=r=>/done|complete|deliver|تحویل|انجام/i.test(r.Status||'')||!!D(r['Final Delivery Date']);
const isLate=r=>{const dl=D(r['Committed Deadline']);if(!dl)return false;const fd=D(r['Final Delivery Date']);return fd?fd>dl:(!isDone(r)&&dl<TODAY)};
const isArch=r=>/^(yes|true|✓)$/i.test(r.Archive||'');
function count(list,k){const m={};list.forEach(r=>{const v=r[k]||'—';m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(id,list,k){const e=count(list,k),mx=Math.max(1,...e.map(x=>x[1]));
 $(id).innerHTML=e.map(([n,v])=>`<div class="row"><span>${esc(n)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join('')||'<span class="hint">داده‌ای نیست</span>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fa(n){return n.toLocaleString('fa-IR')}
function setOpts(id,k){const s=$(id),v=s.value,f=s.options[0].outerHTML;s.innerHTML=f+[...new Set(rows.map(r=>r[k]).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('');s.value=v}
function render(){
 const act=rows.filter(r=>!isArch(r)),open=act.filter(r=>!isDone(r)),done=act.filter(isDone);
 const late=act.filter(isLate),pend=open.filter(r=>/pend|wait|review|در انتظار/i.test((r['Approval Status']||'')));
 const ont=done.filter(r=>D(r['Committed Deadline'])&&D(r['Final Delivery Date'])).filter(r=>!isLate(r));
 const dd=done.filter(r=>D(r['Committed Deadline'])&&D(r['Final Delivery Date']));
 const rev=act.length?act.reduce((s,r)=>s+(+r['Revision Count']||0),0)/act.length:0;
 const hrs=open.reduce((s,r)=>s+(+r['Estimated Hours']||0),0);
 const K=[['کل درخواست‌ها',fa(act.length)],['باز',fa(open.length)],['تحویل‌شده',fa(done.length)],['دارای تأخیر',fa(late.length)],['در انتظار تأیید',fa(pend.length)],['تحویل به‌موقع',dd.length?fa(Math.round(ont.length/dd.length*100))+'٪':'—'],['میانگین بازبینی',fa(+rev.toFixed(1))],['ساعت کار باز',fa(hrs)]];
 $('kpis').innerHTML=K.map(([l,v])=>`<div class="card k"><span>${l}</span><b>${v}</b></div>`).join('');
 bars('c1',act,'Status');bars('c2',act,'Department');bars('c3',act,'Priority');bars('c4',act,'Request Type');
 setOpts('fs','Status');setOpts('fp','Priority');table()}
function table(){
 $('th').innerHTML=COLS.map(([k,l])=>`<th onclick="sortBy('${k}')">${l}${sortK==k?(sortD>0?' ▲':' ▼'):''}</th>`).join('')+'<th></th>';
 const q=$('q').value.toLowerCase(),s=$('fs').value,p=$('fp').value,o=$('fo').value;
 let l=rows.filter(r=>!isArch(r)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!s||r.Status==s)&&(!p||r.Priority==p)&&(!o||(o=='late'?isLate(r):!isDone(r))));
 if(sortK)l.sort((a,b)=>String(a[sortK]).localeCompare(String(b[sortK]),'fa',{numeric:true})*sortD);
 $('tb').innerHTML=l.map(r=>`<tr>${COLS.map(([k])=>{let v=DATEK.includes(k)?J(r[k]):esc(r[k]||'');
  if(k=='Status'||k=='Approval Status'||k=='Priority')v=v?`<span class="tag">${v}</span>`:'';
  if(k=='Committed Deadline'&&isLate(r))v=`<span class="late">⚠ ${v}</span>`;
  if(r._id&&SCH[k]&&EDITABLE.includes(k))v=cell(r,k,SCH[k],v);
  return `<td>${v}</td>`}).join('')}<td>${r._id?`<button class="btn o" title="آرشیو" onclick="save('${r._id}','Archive',true)">📦</button>`:''}</td></tr>`).join('')||`<tr><td colspan="${COLS.length+1}" class="hint">موردی یافت نشد</td></tr>`}
function sortBy(k){sortD=sortK==k?-sortD:1;sortK=k;table()}
function setData(csv,label){rows=parseCSV(csv);$('src').textContent=label+' — '+rows.length+' ردیف';try{localStorage.setItem('gd',csv)}catch(e){}render()}
function loadSample(){setData(SAMPLE,'داده نمونه')}
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>setData(t,f.name))};
['q','fs','fp','fo'].forEach(i=>$(i).oninput=table);
let saved=null;try{saved=localStorage.getItem('gd')}catch(e){}
fetch('/api/data').then(async r=>{if(!r.ok)throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,300));return r.json()}).then(j=>{rows=j.rows;Object.assign(SCH,j.schema);$('src').textContent='متصل به نوشن — ویرایش مستقیم فعال است — '+rows.length+' ردیف';render()}).catch(e=>{window.apiErr=e.message;return fetch('data.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{rows=j.rows;$('src').textContent='همگام‌شده با نوشن — آخرین به‌روزرسانی: '+new Date(j.updated).toLocaleString('fa-IR-u-ca-persian',{dateStyle:'medium',timeStyle:'short'})+' — '+rows.length+' ردیف';render()}).catch(()=>{saved?setData(saved,'آخرین فایل واردشده'):loadSample();$('src').textContent+=' ⚠ اتصال به نوشن برقرار نشد: '+window.apiErr})});
</script>
</body>
</html>
